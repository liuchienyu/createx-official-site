<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Createx 創造娛樂工作室{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Createx 創造娛樂工作室，專注於娛樂活動、藝人合作、品牌企劃、韓國娛樂合作與內容製作。">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="site-header">
    <a href="{{ url_for('home') }}" class="brand">
        <span class="brand-mark">C</span>
        <span class="brand-text">Createx</span>
    </a>

    <nav class="nav">
        <a href="{{ url_for('home') }}">HOME</a>
        <a href="{{ url_for('about') }}">ABOUT</a>
        <a href="{{ url_for('artists') }}">ARTISTS</a>
        <a href="{{ url_for('business') }}">BUSINESS</a>
        <a href="{{ url_for('news') }}">NEWS</a>
        <a href="{{ url_for('shop') }}">SHOP</a>
        <a href="{{ url_for('member') }}">MEMBER</a>
        <a href="{{ url_for('contact') }}">CONTACT</a>
    </nav>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <div>
        <h3>Createx 創造娛樂工作室</h3>
        <p>Create the Moment, Connect the Stage.</p>
    </div>

    <div class="footer-links">
        <a href="{{ url_for('about') }}">ABOUT</a>
        <a href="{{ url_for('business') }}">BUSINESS</a>
        <a href="{{ url_for('contact') }}">CONTACT</a>
    </div>

    <p class="copyright">© 2026 Createx Entertainment Studio. All Rights Reserved.</p>
</footer>

</body>
</html>
