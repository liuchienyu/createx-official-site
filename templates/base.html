<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}創造娛樂工作室{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="創造娛樂工作室，專注於活動企劃、藝人合作、品牌內容、韓國娛樂合作與娛樂製作。">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="site-header">
    <div class="header-left">
        <a href="{{ url_for('home') }}" class="brand">
            <span class="brand-mark">創</span>
            <span class="brand-text">創造娛樂工作室</span>
        </a>

        <nav class="nav nav-main">
            <a href="{{ url_for('home') }}">首頁</a>
            <a href="{{ url_for('about') }}">關於我們</a>
            <a href="{{ url_for('artists') }}">合作藝人</a>
            <a href="{{ url_for('business') }}">業務項目</a>
            <a href="{{ url_for('news') }}">最新消息</a>
            <a href="{{ url_for('contact') }}">聯絡我們</a>
        </nav>
    </div>

    <nav class="nav nav-user">
        <a href="{{ url_for('shop') }}">商城</a>
        <a href="{{ url_for('login') }}">登入</a>
        <a href="{{ url_for('member') }}" class="nav-pill">會員中心</a>
    </nav>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <div>
        <h3>創造娛樂工作室</h3>
        <p>創造每一個被記住的舞台。</p>
    </div>

    <div class="footer-links">
        <a href="{{ url_for('about') }}">關於我們</a>
        <a href="{{ url_for('business') }}">業務項目</a>
        <a href="{{ url_for('contact') }}">聯絡我們</a>
    </div>

    <p class="copyright">© 2026 創造娛樂工作室. All Rights Reserved.</p>
</footer>

</body>
</html>
