{% extends "base.html" %}

{% block title %}{{ artist.name_zh }}｜Createx{% endblock %}

{% block content %}

<section class="artist-detail">
    <div class="artist-photo">
        <img src="{{ artist.image }}" alt="{{ artist.name_zh }}">
    </div>

    <div class="artist-info">
        <p class="eyebrow">{{ artist.category }}</p>
        <h1>{{ artist.name_zh }} {{ artist.name }}</h1>
        <p>{{ artist.bio }}</p>

        <div class="tag-list">
            {% for tag in artist.tags %}
            <span>{{ tag }}</span>
            {% endfor %}
        </div>

        <div class="hero-actions">
            <a class="btn primary" href="{{ url_for('contact') }}">合作洽詢</a>
            <a class="btn ghost" href="{{ artist.instagram }}" target="_blank">Instagram</a>
        </div>
    </div>
</section>

{% endblock %}
