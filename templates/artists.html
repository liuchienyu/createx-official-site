{% extends "base.html" %}

{% block title %}合作藝人｜創造娛樂工作室{% endblock %}

{% block content %}

<section class="page-hero">
    <p class="eyebrow">合作藝人</p>
    <h1>合作藝人與人才</h1>
</section>

<section class="section">
    <div class="artist-grid">
        {% for artist in artists %}
        <a class="artist-card" href="{{ url_for('artist_detail', slug=artist.slug) }}">
            <img src="{{ artist.image }}" alt="{{ artist.name_zh }}">
            <div>
                <p>{{ artist.category }}</p>
                <h3>{{ artist.name_zh }} {{ artist.name }}</h3>
                <span>{{ artist.intro }}</span>
            </div>
        </a>
        {% endfor %}
    </div>
</section>

{% endblock %}
